name: Deploy no VPS
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: apppf
          key: ${{ secrets.VPS_SSH_KEY }}
          script: bash /opt/atualizacao-pf/infra/deploy.sh
